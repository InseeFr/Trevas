name: Run VTL TF TCK (Spark 4)

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master, develop ]

jobs:
  tck-spark4:
    name: TCK VTL v2.1 (Spark 4)
    runs-on: ubuntu-latest
    env:
      TCK_REPORT_TITLE: 'TCK VTL v2.1 (Spark 4)'
      VTL_TCK_BRANCH: master

    steps:
      - name: Checkout main project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clone vtl spec repo
        run: git clone --depth 1 --branch "${VTL_TCK_BRANCH}" https://github.com/sdmx-twg/vtl.git

      - name: Install Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run TCK generator script
        run: |
          DOC_VERSION=v2.1 python3 vtl/scripts/generate_tck_files.py

      - name: Move generated TCK zip to resources
        run: |
          mkdir -p coverage/src/main/resources
          mv vtl/tck/v2.1.zip coverage/src/main/resources/

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-tck-spark4-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build dependencies and run TCK (coverage only, Spark 4 profile)
        id: tck-maven
        continue-on-error: true
        run: |
          set -euo pipefail
          mvn clean install -pl coverage -am -DskipTests --batch-mode -Pspark4-tck
          mvn test -pl coverage --batch-mode -Pspark4-tck

      - name: Prettify TCK Surefire XML for GitHub
        if: always()
        run: python3 coverage/scripts/prettify_tck_surefire_xml.py

      - name: Publish JUnit test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: JUnit (Spark 4)
          # TCK suite only (exclude coverage unit tests: TckDatasetComparisonTest, …)
          path: coverage/target/surefire-reports/TEST-fr.insee.vtl.coverage.TCKTest.xml
          reporter: java-junit
          only-summary: 'true'
          max-annotations: 0
          fail-on-error: 'false'
          fail-on-empty: 'true'

      - name: Generate TCK scripts report
        if: always()
        run: |
          set -euo pipefail
          python3 coverage/scripts/render_tck_job_summary.py
          report=coverage/target/tck-scripts-report.md
          if [[ ! -f "$report" ]]; then
            echo "Missing TCK report at $report" >&2
            exit 1
          fi
          cases=$(sed -n 's/^Total cases: //p' "$report" | head -1)
          if [[ -z "${cases}" || "${cases}" -eq 0 ]]; then
            echo "TCK report has Total cases: ${cases:-missing} (build/tests did not produce Surefire results)" >&2
            exit 1
          fi
          echo "TCK report OK ($cases cases)"
          # Fail the job when Maven produced no usable suite (empty), not when cases fail.
          if [[ "${{ steps.tck-maven.outcome }}" != "success" ]] && [[ ! -f coverage/target/surefire-reports/TEST-fr.insee.vtl.coverage.TCKTest.xml ]]; then
            echo "Maven TCK step failed before writing Surefire XML" >&2
            exit 1
          fi

      - name: Upload full TCK script report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tck-scripts-report-spark4
          path: coverage/target/tck-scripts-report.md
          if-no-files-found: error
